name: Build and Release APK

on:
  push:
    tags:
      - 'v*.*.*'  # триггер при создании тега вида v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Buildozer and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.local/share/python-for-android
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('**/requirements.txt','**/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git zip unzip openjdk-11-jdk wget
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython

      - name: Build APK
        run: |
          export PATH=$HOME/.local/bin:$PATH
          ls -la
          echo "Current directory contents:"
          pwd
          echo "Looking for buildozer.spec:"
          find . -name "buildozer.spec" -type f
          buildozer -v android debug
          
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplepush-apk
          path: bin/*.apk

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
